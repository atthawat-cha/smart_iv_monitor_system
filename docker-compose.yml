services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smis}:${POSTGRES_PASSWORD:-smis_dev_password}@postgres:5432/${POSTGRES_DB:-smis}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Virtual ESP32 fleet — emits telemetry matching the real device contract
  # (016 IoT/IoT.md) so the pipeline/alert engine can be tested without hardware.
  # Opt-in only: `docker compose --profile simulator up device-simulator`
  device-simulator:
    build:
      context: ./tools/mock-device-simulator
    profiles: ["simulator"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:3001/api/v1
      DEVICE_API_KEY: ${DEVICE_API_KEY:-change_me_dev_device_key}
      SEND_INTERVAL_MS: ${SIMULATOR_SEND_INTERVAL_MS:-7000}
      DEVICE_COUNT: ${SIMULATOR_DEVICE_COUNT:-5}
    depends_on:
      - api

volumes:
  postgres_data:
