<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SMIS · Sign in</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="sidebar-logo-mark" style="width:36px;height:36px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 22v-6M4.9 4.9l4.2 4.2M19.1 4.9l-4.2 4.2M2 12h6M22 12h-6M4.9 19.1l4.2-4.2M19.1 19.1l-4.2-4.2"/></svg>
        </div>
      </div>
      <div class="login-title">Smart IV Monitoring System</div>
      <div class="login-sub">Demo mode — pick a role to sign in (mocked, no real auth)</div>
      <div class="role-picker" id="role-picker"></div>
      <button class="btn accent" id="sign-in-btn" style="width:100%;" disabled>Sign in</button>
    </div>
  </div>

  <script src="js/data/seed.js"></script>
  <script src="js/data/scenarios.js"></script>
  <script src="js/core/formulas.js"></script>
  <script src="js/core/alerts.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/engine.js"></script>
  <script>
    const state = SMIS.Store.load();
    let selectedUserId = null;

    const picker = document.getElementById('role-picker');
    picker.innerHTML = state.users.map((u) => `
      <div class="role-option" data-user="${u.id}">
        <div>${u.name}</div>
        <div style="opacity:.65; font-weight:500; margin-top:2px;">${u.role.replace('_', ' ')}</div>
      </div>
    `).join('');

    picker.querySelectorAll('.role-option').forEach((el) => {
      el.addEventListener('click', () => {
        picker.querySelectorAll('.role-option').forEach((o) => o.classList.remove('selected'));
        el.classList.add('selected');
        selectedUserId = el.dataset.user;
        document.getElementById('sign-in-btn').disabled = false;
      });
    });

    document.getElementById('sign-in-btn').addEventListener('click', () => {
      if (!selectedUserId) return;
      SMIS.Actions.login(selectedUserId);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
