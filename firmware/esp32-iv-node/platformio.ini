; SMIS ESP32 IV Node — per "013 Architecture/Hardware & Firmware Architecture.md"
; Hardware: ESP32 DevKit V1, HX711 (load cell ADC), 1kg (MVP) / 2kg (production) load cell,
;           18650 Li-ion battery + TP4056 charger + AMS1117 regulator.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	bogde/HX711@^0.7.5
	bblanchon/ArduinoJson@^7.0.0
